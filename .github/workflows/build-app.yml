name: Build Nord Auto

on:
  workflow_dispatch:
  push:
    paths:
      - "EuroAuto/**"
      - "EuroAuto.xcodeproj/**"
      - ".github/workflows/build-app.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Validate vehicle catalog
        run: python3 scripts/validate_vehicle_catalog.py

      - name: Test Apple catalog decompression
        run: swift scripts/test_vehicle_catalog_decode.swift EuroAuto/Resources/vehicle-catalog.json

      - name: Build macOS app
        run: >-
          xcodebuild
          -project EuroAuto.xcodeproj
          -scheme EuroAuto
          -configuration Release
          -destination 'generic/platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/EuroAuto-macOS"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Verify catalog is bundled in macOS app
        run: python3 scripts/validate_vehicle_catalog.py "$RUNNER_TEMP/EuroAuto-macOS/Build/Products/Release/EuroAuto.app/Contents/Resources/vehicle-catalog.json"

      - name: Package macOS app
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/EuroAuto-macOS/Build/Products/Release/EuroAuto.app" \
            artifacts/Nord-Auto-macOS.zip

      - name: Verify iPhone target compiles
        run: >-
          xcodebuild
          -project EuroAuto.xcodeproj
          -scheme EuroAuto
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/EuroAuto-iOS"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Upload app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nord-Auto-Apple-builds
          path: artifacts/Nord-Auto-macOS.zip
          if-no-files-found: error
          retention-days: 30
